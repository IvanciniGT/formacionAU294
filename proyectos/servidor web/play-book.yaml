- name:                       Instalación y Configuración de NGINX y despliegue de la Web
  hosts:                      all
  gather_facts:               false 

  # become:                     true # Si lo pongo aqui ya no tengo que ponerlo abajo.
                                     # MALA PRACTICA!!!! Todo lo que haga debe ser con permisos de superusuario ? RARO!
                                     # Mejor es identificar las tareas que si lo necesitan y poner el become solo en esas.
  vars:
    distros_soportadas:
      - debian
      - redhat

  pre_tasks:
    - name:                             Pretareas del playbook
      ansible.builtin.include_tasks:    
        file:                           pre_tasks/main.yaml # En este caso usamos la anotación free-form para incluir erl fichero de tareas
                                                            # Muchos módulos soportan la anotación free-form, donde se puede pasar directamente un parametro.
        apply: 
          tags:
            - always

  tasks:
    - name:                             Tareas principales del playbook
      ansible.builtin.include_tasks:    
        file:                           tasks/main.yaml

  post_tasks:
    - name:                             Posttareas del playbook
      ansible.builtin.include_tasks:    post_tasks/main.yaml

  handlers:
    - name:                   Nombre
      listen:                 NOMBRE_EVENTO
