
- name:                   Asegurar que tenemos los repos de nginx configurados en el host (con sus claves)
  when:                   # Cuando me han pasado repos específicos. Si tiran de repos oficiales no. -> CONDICIONAL!
  become:                 true # Necesito permisos de superusuario para poder hacer esta tarea.
                          # Mi problema no es mirar si tengo esos permisos. NECESITO ESOS PERMISOS.
                          # El problema es de quién ejecute el playbook... 
                          # más vale que lo esté ejecutando con un usuario que tenga permisos de superusuario.
                          # Como puedo convertirme en superusuario? sudo....    su - root
                          # Hay muchas formas de poder convertirme en superusuario. Cual uso? NO ES MI PROBLEMA!
                          # Es problema del tio que ejecute esto.. Que diga como en SU ENTORNO QUE ES SUYO NO MIO
                          # Un usuario se transforma en superusuario.
  tags:
          - instalacion

- name:                   Actualizar los repos del sistema operativo, para que nos encuentre la versión de nginx que nos han pedido
  become:                 true 
                          # Cuando ejecutemos el playbook, EL JUEVES, nos daremos cuenta que esta tarea ^^^^ tiene un problema!
                          # Es que estado acabará esta tarea cuando se ejecute? OK, CHANGED
                          # Esta tarea es muy especial. De hecho, mirar la nomenclatura que hemos usado para nombrarla.... 
                          # Qué paradigma hemos usado? Imperativo.
                          # De hecho esta tarea siempre acaba en state: CHANGED. Siempre provoca cambio!
                          # Esto tendrá un impacto. Cuando ejecute el playbook la segunda vez, está tarea seguirá diciendo CHANGED
                          # Y veré que el playbook ha provocado cambios.
                          # Y eso me DESPISTARÁ DE NARICES.
                          # La pregunta no es si la tarea provoca cambios... Sino si me interesa CONTROLAR O NO ESOS CAMBIOS.
                          # Considero YO HUMANO que un apt update (actualizar los repos) ha provocado un cambios REAL en la máquina relativo a lo que es LA INSTALACION DEL NGINX?
  changed_when:           false # No quiero que NUNCA se notifique que esta tarea ha provocado cambios. No porque no los provoque...
                          # Sino porque no me interesa que se considere un cambio relevante para el playbook. 
  tags:
          - instalacion

- name:                   Asegurar que nginx queda instalado en el host en la versión que me interesa
                          # Este es el que ejecutará el dnf o el yum o el apt...
  become:                 true
  tags:
          - instalacion