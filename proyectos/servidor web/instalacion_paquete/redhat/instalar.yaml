
- name:                   Asegurar que tenemos los repos del paquete configurados en el host (con sus claves)

  ansible.builtin.yum_repository:
    name:                 "{{ paquete }}"
    description:          "{{ paquete }}"
    baseurl:              "{{ repositorio }}"
    gpgcheck:             "{{ clave | default('') | length > 0 }}"
    gpgkey:               "{{ clave | default(omit) }}" # omit: Si no hay clave, no rellener el parámetro gpgkey, como si no hubiera escrito la linea
  when:                   repositorio is defined and repositorio | length > 0 # Cuando me han pasado repos específicos. Si tiran de repos oficiales no. -> CONDICIONAL!
  become:                 true # Necesito permisos de superusuario para poder hacer esta tarea.
                          # Mi problema no es mirar si tengo esos permisos. NECESITO ESOS PERMISOS.
                          # El problema es de quién ejecute el playbook... 
                          # más vale que lo esté ejecutando con un usuario que tenga permisos de superusuario.
                          # Como puedo convertirme en superusuario? sudo....    su - root
                          # Hay muchas formas de poder convertirme en superusuario. Cual uso? NO ES MI PROBLEMA!
                          # Es problema del tio que ejecute esto.. Que diga como en SU ENTORNO QUE ES SUYO NO MIO
                          # Un usuario se transforma en superusuario.
                          # Quizás NO OS DISTEIS CUENTA EL DIA 1... Os dije: Crear un playbook es PROGRAMAR!
                          # Os han cambiado el trabajo! Lo veis más claro ahora?

- name:                   Asegurar que el paquete queda instalado en el host en la versión que me interesa
                          # Este es el que ejecutará el dnf o el yum o el apt...
  ansible.builtin.dnf:
    name:                 "{{ paquete }}{{ '' if not version else ('-'' + version) if ((operador_version | default('=')) == '=') else (' ' + operador_version + ' ' + version) }}"
    # Estas expresiones, las IAs (gemini, chatgpt... os las montan en un segundo)
    state:                present
    update_cache:         true

  become:                 true

