---
# Configuración de ansible-navigator para los alumnos que lo usen.
#
# Sirve para VALIDAR en el portátil (--syntax-check), no para ejecutar: las
# máquinas del aula sólo son accesibles desde dentro del clúster, y quien
# ejecuta es AWX. Por eso no se monta ninguna clave SSH.
ansible-navigator:
  ansible:
    inventory:
      entries:
        - ejemplo/inventario.ini
  execution-environment:
    container-engine: auto
    enabled: true
    # Cambiar a la imagen del entorno que toque: básico al empezar,
    # avanzado cuando el curso lo pida.
    image: registry.ivanosuna.com/curso/ee-basico:1.0
    pull:
      policy: missing
  mode: stdout
  logging:
    level: warning
