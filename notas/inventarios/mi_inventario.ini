# En un archivo .ini puedo escribi run inventario.

# Cada máquina irá en una linea del archivo

mi-maquina-1
mi-maquina-2

# Para crear un grupo de hosts
[mis_servidores_web]
mi_servidor_web_raro_1

# En un grupo puedo tener subgrupos
[mis_servidores_web:children]
mis_servidores_nginx
mis_servidores_apache

[mis_servidores_nginx]
mi_servidor_web_nginx1
mi_servidor_web_nginx2

[mis_servidores_apache]
mi_servidor_web_apache1
mi_servidor_web_apache2

# Podemos crear ( definir) serviudores en masa:
[mis_servidores_en_masa]
mi_servidor_[1:30] # Sería lo mismo que haber creado 30 lineas con:
# mi_servidor_1
# mi_servidor_2
# mi_servidor_3
# ...
# mi_servidor_30

# Incluso con sufijos luego:
mi_servidor_[1:30]_backup # Sería lo mismo que haber creado 30 lineas con:
# mi_servidor_1_backup
# mi_servidor_2_backup
# mi_servidor_3_backup
# ...
# mi_servidor_30_backup


# Como veís este archivos? Sencillo/complejo? TRIVIAL!
# Cómo veís la GESTION / MANTENIMIENTO de estos archivos? MUY COMPLICADA!
# Por qué? 
# - Este archivo se volverá GIGANTE
# - Todos los hosts son gestionados por las mismas personas/dptos dentro de la empresa? NO
# Aquí estamos poniendo hosts... Un entorno remoto puede ser un firewall cisco.
# Quiero que la gente de redes tenga un fichero compartido con la gente de BBDD? NADA
# Por supuesto puedo hacer que cada uno monte su propio archivo.. y lo gestione.. pero acabo con reinos de taifas... QUE ESO TAMPOCO MOLA!

# A los entornos remotos les tengo que configurar muchas cosas (formas de conexión, variables...)
# Cada una de esas cosas la pongo en formato: variable= valor, detras del nombre del host
# Si hay muchas, las separo por espacios .

mi-servidor-guay    ansible_host=192.168.1.100 ansible_user=mi_usuario ansible_ssh_private_key_file=/ruta/a/mi/clave_privada version_nginx=1.2.3


# Hay una serie de variables que define ansible:
# - ansible_host: La dirección IP o fdqn del entorno remoto.
#                 Si no está definida esta variable, ansible intenta conectar por red usando el nombre del host (ej. mi-servidor-guay).
#                 El nombre de la máquina/entorno en inventario es otra variable a la que puedo acceder desde los playbooks: inventory_hostname
# - ansible_user: El usuario con el que ansible se conectará al entorno remoto.
# - ansible_password: La contraseña del usuario con el que ansible se conectará al entorno remoto.
# - ansible_ssh_private_key_file: La ruta a la clave privada que ansible usará para la conexión SSH.
    # NOTA: Evidentemente NI DE COÑA! pondremos contraseñas o rutas de fichero sensibles en el inventario.
    # Esos datos los pasamos en tiempo de ejecución al comando ansible o ansible-playbook.
    # $ ansible-playbook -i mi_inventario.ini playbook.yml --ask-pass --ask-become-pass
    # O se los entrego directamente:
    # $ ansible-playbook -i mi_inventario.ini playbook.yml --extra-vars "ansible_password=mi_contraseña"
# - ansible_connection: El tipo de conexión que ansible usará para conectarse al entorno remoto.
#                     Por defecto es 'ssh', pero puede ser 'local', 'winrm', etc.
# - ansible_port: El puerto que ansible usará para conectarse al entorno remoto.
#                Por defecto es 22 para conexiones SSH. Para winrm suele ser 5985 o 5986.

# - ansible_become: Indica si ansible debe usar privilegios elevados (sudo) para ejecutar tareas en el entorno remoto.
# - ansible_become_method: El método que ansible usará para elevar privilegios (por ejemplo, 'sudo', 'su', 'pbrun', etc.).
# - ansible_become_user: El usuario al que ansible intentará cambiar al usar privilegios elevados.

# Hay decenas de variables que ansible puede usar para configurar la conexión y el comportamiento en los entornos remotos.

# Cómo veís la sintaxis de las variables? Simple, cómoda? Es fácil la sintaxis? variable=valor
# La sintaxis es sencilla...
