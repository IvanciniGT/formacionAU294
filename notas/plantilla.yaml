# Esto es YAML
# Ahora bien... yo le paso a ANSIBLE este documento de arriba: usuario:... Y FLIPA !
# Me dice.. que hostias me estas pasando?

# YAML nos ofrece una sintaxis básica. Lo que acabo de contar.
# CADA PROGRAMA QUE USA YAML define su propio ESQUEMA!
# El esquema de un programa define qué estructura debe tener un documento VALIDO para ese programa.
# Que marcas / claves deben usarse, los tipos de datos asociados, etc.

---
# Ejemplo de YAML de kubernetes:
apiVersion: v1
kind: Pod
metadata:
  name: ejemplo-pod
spec:
  containers:
    - name: ejemplo-contenedor
      image: nginx
---
# Ejemplo de YAML en netplan
network:
  version: 2
  ethernets:
    eth0:
      dhcp4: true
    nameservers:
      addresses:
        - 8.8.8.8
        - 8.8.4.4
---

# Ejemplo de Playbook en ANSIBLE
- hosts: all
  tasks:
    - name: Instalar nginx
      apt:
        name: nginx
        state: present
---
# Que un documento sea yaml no significa que cualquier programa pueda leerlo.
# Nuestro objetivo Lo que queda de lunes, martes y miércoles:
# APRENDER EL ESQUEMA YAML DE ANSIBLE para crear playbooks!
# Que tiene sus propias marquitas que significarán ciertas cosas.
