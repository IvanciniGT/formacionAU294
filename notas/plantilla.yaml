---
# NODOS DE COLECCION: LISTAS ORDENADAS Y MAPAS DESORDENADOS.

# Listas Ordenadas: Colecciones secuenciales de NODOS.
- NODO
- Texto
-       123
- true
- # Incluso un nodo puede ser otra lista
                   - Subitem 1
                   - 33
 # Para sublistas, necesitamos sangrar al menos 1 espacio respecto al nivel de la lista principal.
- - Subitem1 # Esto es igual a lo de arriba... Puedo empezar la sublista en la linea siguiente o en la misma.
  - Subitem2
# IMPORTANTE, YAML EXIGE CONSISTENCIA EN EL SANGRADO... EN CADA NIVEL. El sangrado que yo quiera usar.. no se mete. PERO ME PIDE SER CONSISTENTE EN CADA NIVEL
---

# Hay una sintaxis alternativa para listas ordenadas:
- item1
- 33
- true
---
["item1", 33, true]
# Esta sintaxis NO LA USAMOS! ESTA TOTALMENTE DESACONSEJADA! Motivos:
# - Más dificil de leer.
# - Dónde acabará este archivo? Dónde se guardará? ESTE ARCHIVO QUE ES EN REALIDAD EN ANSIBLE? PROGRAMA! SCRIPT!
#   Y los programas se guardan en UN SISTEMA DE CONTROL DE CODIGO FUENTE ( Sistemas control de versiones ) . Una herramienta tipo GIT!
#   Y git es capaz de identificar cambios en un archivo... A NIVEL DE LINEA!
# Entonces, por qué está la sintaxis? Por 2 motivos:
# MOTIVO 1: Compatibilidad con JSON. YAML Se ha tragado LITERALMENTE JSON. Es decir, cualquier (99.9%) documento JSON es leído por un parser YAML... es considerado a su vez un documento YAML.
# MOTIVO 2: PAra representar LISTAS VACIAS:
---
[]
---
# Mapas desordenados:
# Colecciones de NODOS que se identifican con una clave.
clave1:                                 NODO1
clave2:                                 Texto
clave3:                                 123
clave4:                                 true
clave5:
                                      - subitem1
                                      - subitem2
clave6:
        clave6_sub1:                    valor1
        clave6_sub2:                    valor2
clave7:
    clave6_sub1:                        valor1
    clave6_sub2:                        valor2
clave8:
                    clave6_sub1:        valor1
                    clave6_sub2:        valor2


# Esta es la pinta más habitual que tendrán los documentos yaml .
# Mismas reglas de sangrado que en las listas
---
# NOTAS:
# Hay una sintaxis alternativa para mapas desordenados:
 {
   "clave1": "NODO1",
   "clave2": "Texto",
   "clave3": 123,
   "clave4": true,
   "clave5": ["subitem1", "subitem2"],
   "clave6": {
     "clave6_sub1": "valor1",
     "clave6_sub2": "valor2"
   }
 }
---
# Por qué existe? 2 motivos:
# MOTIVO 1: Compatibilidad con JSON.
# MOTIVO 2: Para representar mapas vacíos.
---
{}

---

# NOTA: Los mapas son DESORDENADOS! Qué significa eso?
# Significa que el orden en que definimos las claves no importa.
# Por ejemplo:
clave1: texto
clave2: otro texto
clave3: 123
---
clave2: otro texto
clave1: texto
clave3: 123
# Ambos 2 documentos se consideran equivalentes, a pesar de que el orden de las claves es diferente.
---

