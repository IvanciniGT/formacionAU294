# JSON :
# {
#   "id": 33,
#   "nombre": "Ivan",
#   "apellidos": ["Osuna", "Ayuste"],
#   "edad": 30
#}

---

# En yaml:
usuario:
  id: 33
  nombre: Ivan
  apellidos:
    - Osuna
    - Ayuste
  edad: 30
