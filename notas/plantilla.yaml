# YAML es un lenguaje para estructurar información. 
# Sería una alternativa a XML o a JSON.
# PERO MUCHO MEJOR!!! QUE AMBOS!
# De hecho la industria se está moviendo en su conjunto a YAML:
# - Kubernetes : habla YAML
# - Ansible : usa YAML para definir playbooks
# - GitHub Actions : usa YAML para definir flujos de trabajo
# - Docker Compose : usa YAML para definir servicios
# - Spring : usa YAML para definir configuraciones
# - Ubuntu: Toda la configuración de red (netplan) se define en YAML

# Lo primero: PODEMOS PONER COMENTARIOS : ALELUYA! Con la almohadilla (#) . Lo que haya detrás se considera comentario.
# Seguimos: YAML... umm suena sospechosamente igual a otros lenguajes que hemos oído más.
#            XML
#           HTML
# ML = Lenguaje de marcado (Markup Language) ->     <tag></tag>
# Pero ... en YAML hicieron una cachondada con el nombre... son siglas.. es un acrónimo recursivo.
# YAML = YAML Ain't Markup Language (YAML no es un lenguaje de marcado)

# Es un lenguaje orientado a SERES HUMANOS, muy inspirado en python.

# IMPORTANTE: Dentro de un archivo YAML podemos tener muchos documentos YAML. EIN?
# En un archivo XML tengo un único documento XML.
# En un archivo JSON tengo un único documento JSON.
# Pero en un archivo YAML puedo tener muchos documentos YAML.
...
---
# --- es el símbolo que se utiliza en YAML como marca de inicio de documento. La ponemos en todos los documentos salvo en el primero.
# NOTA: Hay "horteras", que no saben muy bien lo que están haciendo, que usan la marca ...
# La marca ... es el indicativo en YAML de FIN DE DOCUMENTO.
# ESTO NO SE USA NUNCA EN FICHEROS. Solo distrae y confunde.
# ESTO SE CREA EN YAML PARA OTRA COSA: Cuando mando documentos vía streaming, por red por ejemplo.
# En este caso puede pasar tiempo entre que acabo de enviar un documento y comienzo a enviar el siguiente.

...
# TIEMPO ENTRE DOCUMENTOS EN STREAMING
# En ficheros NO TIENE SENTIDO. CUANDO EMPIEZA UNO ES QUE HA TERMINADO EL ANTERIOR. YA ESTA.
---
# Un documento YAML es UN NODO!
# Y hay 2 tipos de nodos: ESCALARES y DE COLECCION
---
# ESCALARES: Son datos sencillos: TEXTO, NUMERO, FECHA
---
# NUMEROS:
3
---
-5.19
---
# Valores lógicos: BOOLEANOS:
true # TRUE True
---
false # FALSE False
---
# NOTA sobre booleanos.
# En YAML 1.1 (ahora estamos en la versión 1.2 de la especificación) se admitían como booleanos:
# yes y YES Yes
# no n NO No
# on ON On
# off OFF Off

# En YAML 1.2 ya no se consideran booleanos los valores anteriores, solo true/false.
# Lo hicieron mal. No debieron quitarlo de repente... Debieron marcarlo como obsoleto "DEPRECATED"
# para dar a la gente tiempo para adaptarse.
# Como no lo hicieron, los "parsers" (Programas que leen archivos yaml) decidieron, muchos de ellos, seguir aceptando los valores antiguos como booleanos.
# REGLA: Si veo yes/no/on/off en un archivo YAML 1.2, lo cambio inmediatamente a true/false.
# Puede que funcione o puede que no... y no tengo garantías de que si funciona vaya a seguir funcionando en el futuro.
---
# Textos: CON DIFERENCIA LO MAS COMPLEJO DE YAML
Yo 

"soy \nun 'texto 
escrito #en YAML
---
"Yo 

\"soy \nun 'texto 
escrito #en YAML"
# LA contrabarra solo sirve como caracter de escape entre comillas dobles:
# \n \t \\
---
'Yo 

"soy \nun ''texto 
escrito #en YAML'
# YAML ignora los saltos de linea.. Más bien, los transforma en espacios en blanco!
#JEJE...a no ser que ponga 2 seguidos!
---
# Necesitamos SIMPLIFICAR ESTO
# Cómo trabajamos realmente con textos: SIEMPRE SIN COMILLAS A NO SER QUE SEA ESTRICTAMENTE NECESARIO PONERLAS (por tener # dentro del texto)
# Y siempre escribimos así textos con UNA SOLA LINEA!
---
# Si necesito escribir textos en varias lineas! TACHAN !!!! 
# YAML ofrece otras 2 sintaxis alternativas para textos.
# Literal
|-
    Aquí puedo escribir un texto en 
    varias lineas

    Y ese texto puede contener caracteres especiales 
    como # y comillas ' " sin problemas. -: \
    YAML no toca nada de este texto... se lo traga literalmente...
    casi... El sangrado de la primera linea se descuenta de todas.





# NOTA: OJO!
# Un tabulador no es lo mismo que varios espacios en blanco (aunque en pantalla me lo parezca)
# Si una linea tiene un tab y la siguiente 2 espacios (o 4) PETARÁ!
# NO PODEMOS USAR VI, VIM, NANO, BLOC DE NOTAS , ULTRAEDIT ...
# Para trabajar con yaML necesito un BUEN ENTORNO DE TRABAJO UN BUEN EDITOR DE TEXTO
# COMO VSCODE, que automáticamente reemplaza los tabuladores por espacios (o viceversa)
